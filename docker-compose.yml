# Production-shaped stack: PostgreSQL, the API, and separate audit workers.
#
# Jobs are durable (2.4): the API stores each audit in PostgreSQL and the
# workers claim them from there (app/tasks.py), so an API restart loses
# nothing and a worker that dies is replaced by another picking its job up.
# There is no Redis or Celery: PostgreSQL is the queue. Scale workers with
#   docker compose up -d --scale worker=3
#
# Evidence (screenshots) lives on the shared `evidence` volume, so it
# survives restarts and redeploys and the API can verify its fingerprints.

version: "3.9"

services:
  postgres:
    # Debian-based, NOT -alpine: the ssl settings below use Debian's
    # self-signed "snakeoil" certificate, which the Alpine image does not
    # ship -- on Alpine Postgres exits at boot with "could not load server
    # certificate file". Replace it with a real certificate for anything
    # beyond a private network.
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darkpattern_auditor}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SECURITY: no `ports:` mapping. Postgres is reachable only over the
    # internal compose network by the api/worker services. Publishing
    # 5432 to the host exposes the database to anything that can reach
    # this machine. For local inspection use:
    #   docker compose exec postgres psql -U $POSTGRES_USER
    expose: ["5432"]
    # Require TLS for all connections and scram-sha-256 (not md5) for auth.
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      -c password_encryption=scram-sha-256

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS must be set in .env}
      # The API only queues audits; the worker service runs the browsers.
      RUN_AUDIT_WORKERS: "false"
      EVIDENCE_DIR: /data/evidence
      MAX_ACTIVE_AUDITS_PER_ORG: ${MAX_ACTIVE_AUDITS_PER_ORG:-3}
      API_KEYS: ${API_KEYS:?API_KEYS must be set in .env — the app refuses to run unauthenticated}
      # Required in production (the app refuses to start without it): the
      # key(s) allowed to delete and to see every organisation.
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:?ADMIN_API_KEYS must be set in .env}
      # The public https address of this deployment; the public demo walks
      # the practice storefront there.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set in .env}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      MAX_STORED_AUDITS: ${MAX_STORED_AUDITS:-500}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [postgres]
    # Bind to loopback only: terminate TLS at a reverse proxy (nginx/Caddy/
    # a cloud load balancer) in front of this, rather than exposing the app
    # server directly to the internet over plain HTTP.
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - evidence:/data/evidence

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS must be set in .env}
      API_KEYS: ${API_KEYS:?API_KEYS must be set in .env}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:?ADMIN_API_KEYS must be set in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set in .env}
      EVIDENCE_DIR: /data/evidence
      AUDIT_WORKERS: ${AUDIT_WORKERS:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [postgres]
    # The worker runs a browser on untrusted sites: give it nothing extra.
    # Network isolation through an egress proxy is the next step (see
    # docs/operations.md); application-level guards are already in place.
    security_opt: ["no-new-privileges:true"]
    volumes:
      - evidence:/data/evidence

volumes:
  pgdata:
  evidence:
