<!doctype html><html><head><meta charset="utf-8"><title>Deal of the day</title>
<link rel="stylesheet" href="../fixture.css"></head><body>
<header>DealDay (fictional test site)</header>
<main><div class="card"><h1>Bluetooth speaker</h1>
<p class="price">₹1,499</p><p>Hurry! Offer ends in <b id="t">09:59</b></p>
<button>Buy now</button></div></main>
<script>
  // Restarts from 09:59 on every load: not a real deadline.
  let s = 599; const t = document.getElementById("t");
  setInterval(() => { s--; t.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }, 1000);
</script></body></html>
