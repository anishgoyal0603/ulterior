[pytest]
# Registering the marker is not cosmetic. Without it pytest prints a
# PytestUnknownMarkWarning for every browser test it collects, which buries
# the real warnings in noise -- and a collaborator running the suite for the
# first time cannot tell a harmless warning from a broken install.
markers =
    ui: end-to-end tests that start a real server and drive a real browser.
        Slower than the rest (a real audit takes ~10s). Skip while iterating
        with:  pytest tests/ -q -m "not ui"
