<!DOCTYPE html>
<html><head><title>DealBazaar — Home</title></head>
<body>
<h1>Today's deals</h1>

<!--
  DP-10 fixture, step 1 of 3.

  The interruption carries a STABLE id ("newsletter-nag") and a ROTATING
  discount number. That combination is the whole point: signature matching
  normalises digits away, so "Get 10% off" here and "Get 15% off" on page 2
  resolve to the same interruption rather than reading as two different ones.
  Without that normalisation a site could defeat the detector by changing one
  number, and DP-10 would never fire on any real page.

  It has a working "No thanks" control, so the crawler dismisses it here —
  putting a refusal on record. Its reappearance on later steps is what
  converts "a popup exists" into "a request repeated after refusal".
-->

<div id="newsletter-nag" class="modal"
     style="position:fixed; top:0; left:0; width:100%; height:60%;
            background:#222; color:#fff; z-index:9999; padding:30px;">
  <h2>Get 10% off your first order</h2>
  <p>Join our mailing list for exclusive deals.</p>
  <button id="join-1">Sign me up</button>
  <button id="close-1">No thanks</button>
</div>

<p>Browse electronics, fashion and home essentials.</p>
<a href="page2.html">Electronics</a>
</body></html>
