<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Sahaj Foods - Checkout</title><link rel="stylesheet" href="shop.css"></head>
<body><header>Sahaj Foods</header><main><div class="card">
<h1>Checkout</h1>
<div class="line-item" data-name="Cold-pressed oil 1L" data-price="640"><span>Cold-pressed oil 1L</span><span>₹640</span></div>
<div class="line-item" data-name="Delivery" data-price="40"><span>Delivery</span><span>₹40</span></div>
<p class="total" data-total="680"><span>Total</span><span>₹680</span></p>

<label for="terms">
  <input type="checkbox" id="terms" name="terms" required>
  I have read the Privacy Policy, including how my data is shared with our delivery partners
</label>
<label for="marketing">
  <input type="checkbox" id="marketing" name="marketing">
  Optional: send me promotions and offers by email
</label>

<button class="cta">Pay Now</button>
</div></main><footer>Sahaj Foods · Grievance Officer: grievance@example.invalid</footer></body></html>
