<script>
// A REAL countdown: counted from a fixed absolute deadline, so it decreases
// with wall-clock time and keeps decreasing across a reload. This is what an
// honest timer does, and DP-01 must not report it.
var deadline = Date.now() + 9667 * 1000;
function tick() {
  var s = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
  var h = String(Math.floor(s/3600)).padStart(2,'0');
  var m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  document.getElementById('t').textContent = h + ':' + m + ':' + String(s%60).padStart(2,'0');
}
tick(); setInterval(tick, 1000);
</script></body></html>
