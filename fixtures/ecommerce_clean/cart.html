<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HonestCart - Cart</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<header class="shop-head">
  <span class="logo">HonestCart</span>
  <nav class="shop-nav"><span>Mobiles</span><span>Accessories</span><span>Deals</span></nav>
  <span class="cart-chip">Cart · 1</span>
</header>
<main>
  <div class="summary">
    <h1>Your Cart</h1>
    <div class="line-item" data-name="Premium Phone Case" data-price="299">Premium Phone Case - ₹299</div>
    <p class="subtotal" data-subtotal="299">Subtotal: ₹299</p>
    <div class="consent-widget">
      <label><input type="checkbox" id="insurance"> Add Order Protection Insurance - ₹49 (optional)</label>
    </div>
    <a class="next-step" href="checkout.html">Proceed to Checkout</a>
    <p class="trust">Secure payments · 7-day replacement</p>
  </div>
</main>
</body></html>
