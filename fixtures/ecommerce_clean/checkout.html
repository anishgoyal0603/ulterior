<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HonestCart - Checkout</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<header class="shop-head">
  <span class="logo">HonestCart</span>
  <nav class="shop-nav"><span>Mobiles</span><span>Accessories</span><span>Deals</span></nav>
  <span class="cart-chip">Cart · 1</span>
</header>
<main>
  <div class="summary">
    <h1>Checkout</h1>
    <div class="line-item" data-name="Premium Phone Case" data-price="299">Premium Phone Case - ₹299</div>
    <p class="total" data-total="299">Total: ₹299</p>
    <button class="btn-pay">Pay Now</button>
    <p class="trust">Secure payments · 7-day replacement · No hidden fees</p>
  </div>
</main>
</body></html>
