<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopMart - Checkout</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<header class="shop-head">
  <span class="logo">Shop<span>Mart</span></span>
  <nav class="shop-nav"><span>Mobiles</span><span>Accessories</span><span>Deals</span></nav>
  <span class="cart-chip">Cart · 2</span>
</header>

<main>
  <div class="summary">
    <h1>Checkout</h1>
    <div class="line-item" data-name="Premium Phone Case" data-price="299">Premium Phone Case - ₹299</div>
    <div class="line-item" data-name="Order Protection Insurance" data-price="49">Order Protection Insurance - ₹49</div>
    <div class="line-item" data-name="Delivery Fee" data-price="49">Delivery Fee - ₹49</div>
    <div class="line-item" data-name="Platform Fee" data-price="60">Platform Fee - ₹60</div>
    <p class="total" data-total="457">Total: ₹457</p>
    <button class="btn-pay">Pay Now</button>
    <p class="trust">Secure payments · 7-day replacement</p>
  </div>
</main>
</body></html>
