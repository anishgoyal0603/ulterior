<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopMart - Product</title>
<link rel="stylesheet" href="shop.css">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Product","name":"Premium Phone Case",
 "offers":{"@type":"Offer","price":"299","priceCurrency":"INR"}}
</script>
</head>
<body>
<header class="shop-head">
  <span class="logo">Shop<span>Mart</span></span>
  <nav class="shop-nav"><span>Mobiles</span><span>Accessories</span><span>Deals</span></nav>
  <span class="cart-chip">Cart · 0</span>
</header>

<main>
  <div class="product">
    <div class="shot"></div>
    <div class="product-body">
      <h1>Premium Phone Case</h1>
      <p class="rating"><b>4.4 ★</b> · 2,187 ratings · Shock-absorbing polycarbonate</p>
      <p class="price" data-price="299">₹299<span class="strike">₹899</span><span class="save">67% off</span></p>
      <p class="urgency-msg">⏰ Offer ends in: <span id="timer">00:04:59</span></p>
      <div><a class="cta" href="cart.html">Add to Cart</a></div>
      <p class="trust">Secure payments · 7-day replacement</p>
    </div>
  </div>
</main>

<script>
// FAKE countdown: always restarts from the same fixed value on every load,
// never actually reaches zero relative to a real deadline. This is the whole
// point of the fixture -- DP-01 loads the page twice with real time in
// between and proves the "deadline" did not move.
let t = 299;
setInterval(() => {
  t--; if (t < 0) t = 299;
  document.getElementById('timer').innerText =
    '00:' + String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}, 1000);
</script>
</body></html>
