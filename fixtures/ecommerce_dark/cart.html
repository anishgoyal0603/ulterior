<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopMart - Cart</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<header class="shop-head">
  <span class="logo">Shop<span>Mart</span></span>
  <nav class="shop-nav"><span>Mobiles</span><span>Accessories</span><span>Deals</span></nav>
  <span class="cart-chip">Cart · 2</span>
</header>

<main>
  <div class="summary">
    <h1>Your Cart</h1>
    <div class="line-item" data-name="Premium Phone Case" data-price="299">Premium Phone Case - ₹299</div>
    <div class="line-item sneaked" data-name="Order Protection Insurance" data-price="49">
      <input type="checkbox" id="insurance" checked> Order Protection Insurance - ₹49
    </div>
    <p class="subtotal" data-subtotal="348">Subtotal: ₹348</p>

    <div class="consent-widget">
      <p><strong>Protect this order?</strong> Covers accidental damage for 12 months.</p>
      <button class="btn-accept">Yes, protect my order!</button>
      <button class="btn-decline">No thanks, I don't want my order protected and accept all risk</button>
    </div>

    <a class="next-step" href="checkout.html">Proceed to Checkout</a>
    <p class="trust">Secure payments · 7-day replacement</p>
  </div>
</main>
</body></html>
